# https://taskfile.dev

version: '3'

tasks:
  ensure-hostname:
    desc: Create .hostname file if it doesn't exist
    internal: true
    silent: true
    status:
      - test -f .hostname
    cmds:
      - |
        if [[ -n "$PROMPT_HOST" && "$PROMPT_HOST" =~ ^[0-9A-Za-z-]+$ ]]; then
          echo "$PROMPT_HOST" > .hostname
          echo "Created .hostname from PROMPT_HOST: $PROMPT_HOST"
        else
          # Determine OS-specific hosts directory
          if [[ "$(uname)" == "Darwin" ]]; then
            HOSTS_DIR="config/hosts/Darwin"
          else
            HOSTS_DIR="config/hosts/NixOS"
          fi

          # Get list of existing host folders
          HOSTS=$(ls -1 "$HOSTS_DIR" 2>/dev/null | sort)

          # Build choice list with "Other" option
          CHOICE=$(echo -e "${HOSTS}\nOther (create new folder)" | gum choose --header "Select hostname")

          if [[ "$CHOICE" == "Other (create new folder)" ]]; then
            HOSTNAME=$(gum input --placeholder "Enter new hostname")
            if [[ -n "$HOSTNAME" ]]; then
              mkdir -p "$HOSTS_DIR/$HOSTNAME"
              echo "Created new host folder: $HOSTS_DIR/$HOSTNAME"
            fi
          else
            HOSTNAME="$CHOICE"
          fi

          echo "$HOSTNAME" > .hostname
          echo "Created .hostname: $HOSTNAME"
        fi
      
  deploy:
    desc: show plan for update, then apply it if accepted
    vars:
      NIX_HOSTNAME:
        sh: cat .hostname
    deps:
      - ensure-hostname
    cmds:
      - cmd: nh os switch ./config --ask -H {{ .NIX_HOSTNAME }}
        platforms:
          - linux
      - cmd: nh darwin switch ./config --ask -H {{ .NIX_HOSTNAME }}
        platforms:
          - darwin

  build:
    desc: build the derivation
    vars:
      NIX_HOSTNAME:
        sh: cat .hostname
    deps:
      - ensure-hostname
    cmds:
      - cmd: nh os build ./config -H {{ .NIX_HOSTNAME }}
        platforms:
          - linux
      - cmd: nh darwin build ./config -H {{ .NIX_HOSTNAME }}
        platforms:
          - darwin

  update:
    desc: updates the system's packages
    dir: config
    cmds:
      - nix flake update
      - task: deploy

  deploy-sachi:
    desc: Deploy NixOS configuration to sachi remotely over SSH
    cmds:
      - ./scripts/deploy-remote.sh sachi

# https://taskfile.dev

version: '3'


tasks:
  internal-deploy:
    internal: true
    prompt: Do you want to deploy this derivation? This will also `git add -A` and commit.
    dir: ./config
    cmds:
      - cmd: git add -A
      - cmd: git commit -m "Deploy"
        ignore_error: true
      # bootstrap: - sudo nix --extra-experimental-features nix-command --extra-experimental-features flakes run nix-darwin/nix-darwin-25.05#darwin-rebuild -- switch --flake .
      - cmd: sudo darwin-rebuild switch --flake .
        platforms: [darwin]
      - cmd: sudo nixos-rebuild switch --flake ./config
        platforms: [linux/amd64]
      - git show --pretty="" --name-only HEAD
  update-cline:
    desc: Update the cline CLI package to the latest npm version
    cmds:
      - bash config/modules/hereafter/npm/update-cline.sh
  diff:
    cmds:
      - ./diff.sh
  deploy:
    cmds:
      - task: diff
      - task: internal-deploy

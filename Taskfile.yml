# https://taskfile.dev

version: '3'

tasks:
  ensure-hostname:
    desc: Create .hostname file if it doesn't exist
    internal: true
    silent: true
    status:
      - test -f .hostname
    cmds:
      - |
        if [[ -n "$PROMPT_HOST" && "$PROMPT_HOST" =~ ^[0-9A-Za-z-]+$ ]]; then
          echo "$PROMPT_HOST" > .hostname
          echo "Created .hostname from PROMPT_HOST: $PROMPT_HOST"
        else
          # Determine OS-specific hosts directory
          if [[ "$(uname)" == "Darwin" ]]; then
            HOSTS_DIR="config/hosts/Darwin"
          else
            HOSTS_DIR="config/hosts/NixOS"
          fi

          # Get list of existing host folders
          HOSTS=$(ls -1 "$HOSTS_DIR" 2>/dev/null | sort)

          # Build choice list with "Other" option
          CHOICE=$(echo -e "${HOSTS}\nOther (create new folder)" | gum choose --header "Select hostname")

          if [[ "$CHOICE" == "Other (create new folder)" ]]; then
            HOSTNAME=$(gum input --placeholder "Enter new hostname")
            if [[ -n "$HOSTNAME" ]]; then
              mkdir -p "$HOSTS_DIR/$HOSTNAME"
              echo "Created new host folder: $HOSTS_DIR/$HOSTNAME"
            fi
          else
            HOSTNAME="$CHOICE"
          fi

          echo "$HOSTNAME" > .hostname
          echo "Created .hostname: $HOSTNAME"
        fi
      
  deploy:
    desc: show plan for update, then apply it if accepted
    vars:
      NIX_HOSTNAME:
        sh: cat .hostname
    deps:
      - ensure-hostname
    cmds:
      - cmd: nh os switch ./config --ask -H {{ .NIX_HOSTNAME }}
        platforms:
          - linux
      - cmd: nh darwin switch ./config --ask -H {{ .NIX_HOSTNAME }}
        platforms:
          - darwin

  update-fetchurl:
    desc: "update url+hash in a nix file: task update-fetchurl FILE=path/to/file.nix URL=https://..."
    cmds:
      - scripts/update-fetchurl.sh {{.FILE}} {{.URL}}

  update-go:
    desc: fetch latest stable Go release and patch go.nix
    vars:
      LATEST_GO:
        sh: curl -fsSL 'https://go.dev/dl/?mode=json' | jq -r '.[0].version'
    status:
      - grep -q '{{.LATEST_GO}}' config/modules/hereafter/hm/go.nix
    cmds:
      - scripts/update-go.sh {{.LATEST_GO}}

  update-rad:
    desc: fetch latest rad release and patch rad.nix
    vars:
      LATEST_RAD:
        sh: curl -fsSL 'https://api.github.com/repos/amterp/rad/releases/latest' | jq -r '.tag_name | sub("^v"; "")'
    status:
      - grep -q 'version = "{{.LATEST_RAD}}"' config/packages/rad.nix
    cmds:
      - scripts/update-github-release.sh config/packages/rad.nix amterp/rad {{.LATEST_RAD}}

  update-radar:
    desc: fetch latest radar release and patch radar.nix
    vars:
      LATEST_RADAR:
        sh: curl -fsSL 'https://api.github.com/repos/skyhook-io/radar/releases/latest' | jq -r '.tag_name | sub("^v"; "")'
    status:
      - grep -q 'version = "{{.LATEST_RADAR}}"' config/packages/radar.nix
    cmds:
      - scripts/update-github-release.sh config/packages/radar.nix skyhook-io/radar {{.LATEST_RADAR}}

  update:
    desc: updates the system's packages
    cmds:
      - task: update-go
      - task: update-rad
      - task: update-radar
      - cmd: cd config && nix flake update
      - task: deploy
